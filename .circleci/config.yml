# .circleci/config.yml
version: 2.1

orbs:
    docker: circleci/docker@4.0.1

jobs:
    build:
        docker:
            - image: cimg/base:2026.10
              environment:
                  IMAGE_NAME: silarhi/symfony-docker-ci
        steps:
            - checkout # Étape 1
            - setup_remote_docker:
                  docker_layer_caching: true

            # Étapes 2 & 3
            - docker/check:
                  docker_password: DOCKER_PWD
            - docker/build:
                  image: $IMAGE_NAME
                  tag: 1.$CIRCLE_BUILD_NUM,latest
                  extra_build_args: --build-arg APP_VERSION=1.$CIRCLE_BUILD_NUM --build-arg GIT_COMMIT=${CIRCLE_SHA1:0:7}
            - docker/push:
                  image: $IMAGE_NAME
                  tag: 1.$CIRCLE_BUILD_NUM
            - when:
                  condition:
                      equal: [main, << pipeline.git.branch >>]
                  steps:
                      - docker/push:
                            image: $IMAGE_NAME
                            tag: latest
                            step_name: Docker push latest
    deploy: # Étape 4
        machine:
            image: ubuntu-2404:current
        steps:
            - add_ssh_keys:
                  fingerprints:
                      - 'de:c3:47:8e:28:31:55:01:9d:f7:08:f9:df:8e:79:e0'
            - run:
                  name: 'Deploy image to production'
                  command: |
                      ssh ${PRODUCTION_SERVER_USER}@${PRODUCTION_SERVER_IP} "cd ${PRODUCTION_SERVER_PATH} && ./deploy.sh"

# On éxécute ces étapes lors d'un commit sur la branche main uniquement
workflows:
    build-and-deploy:
        jobs:
            - build
            - deploy:
                  requires:
                      - build
                  filters:
                      branches:
                          only: main
