picasso:
    loaders:
        filesystem:
            path: '%kernel.project_dir%/public'

    transformers:
        glide:
            sign_key: '%kernel.secret%'
            cache: '%kernel.project_dir%/var/storage/picasso-cache'
            driver: gd
            public_cache:
                enabled: false

    placeholders:
        blur:
            type: transformer
            size: 10
            blur: 5
            quality: 30
        # Smooth gradient preview, inlined as a tiny PNG data URI (kornrunner/blurhash + imagine/imagine)
        blurhash:
            type: blurhash
            driver: gd

    default_placeholder: blur
