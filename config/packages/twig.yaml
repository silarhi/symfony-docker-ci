twig:
    file_name_pattern: '*.twig'
    globals:
        # Suffix of the <title>, og:site_name (templates/base.html.twig)
        site_name: 'SILARHI Labs'
        php_version: !php/const PHP_VERSION
        app_version: '%env(APP_VERSION)%'
        git_commit: '%env(GIT_COMMIT)%'
        # The Umami tracker loads in prod only, when the website id is set (templates/base.html.twig)
        umami_website_id: '%env(default::UMAMI_WEBSITE_ID)%'

when@test:
    twig:
        strict_variables: true
