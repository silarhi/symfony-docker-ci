<!doctype html>
<!--
    Social preview of labs.silarhi.fr (assets/images/og-image.jpg, 1200×630, og:image), in the layout of sainthillier.fr's.
    Regenerate it with `pnpm og-image` after a design or copy change.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <!-- The site's fonts, from Google Fonts: only this page loads them, on the machine that draws the images -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@600;700;800&display=block" />
        <style>
            :root {
                --primary: #2556cf;
                --pill: #f7d325;
                --on-pill: #111827;
                --surface: #f9fafb;
                --surface-card: #ffffff;
                --surface-low: #eef3fd;
                --surface-high: #dce6fb;
                --ink: #111827;
                --muted: #4b5563;
                --dot: #f7d325;
                --hairline: rgb(0 0 0 / 0.08);
                --font-sans: 'Lato', sans-serif;
                --font-heading: 'Montserrat', sans-serif;
            }

            * {
                box-sizing: border-box;
                margin: 0;
            }

            html,
            body {
                width: 100vw;
                height: 100vh;
                overflow: hidden;
            }

            body {
                position: relative;
                display: flex;
                flex-direction: column;
                padding: 64px 72px 56px;
                background: var(--surface);
                color: var(--ink);
                font-family: var(--font-sans);
                -webkit-font-smoothing: antialiased;
            }

            /* GitHub crops its previews to other ratios: what matters stays 80px away from every edge */
            body.github {
                padding: 80px;
            }

            svg {
                width: 1em;
                height: 1em;
                flex-shrink: 0;
            }

            .blob {
                position: absolute;
                border-radius: 9999px;
                filter: blur(64px);
            }

            .blob-primary {
                top: -160px;
                right: -80px;
                width: 620px;
                height: 620px;
                background: rgb(37 86 207 / 0.08);
            }

            .blob-accent {
                bottom: -200px;
                left: -120px;
                width: 460px;
                height: 460px;
                background: rgb(247 211 37 / 0.22);
            }

            .badges {
                position: relative;
                display: flex;
                gap: 10px;
                margin-bottom: 28px;
            }

            .badge {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 8px 16px;
                border-radius: 9999px;
                background: var(--surface-low);
                font-size: 16px;
                font-weight: 600;
                letter-spacing: 0.04em;
                white-space: nowrap;
            }

            .badge-status {
                background: var(--surface-high);
                text-transform: uppercase;
            }

            .badge-topic {
                color: var(--primary);
            }

            .dot {
                width: 10px;
                height: 10px;
                border-radius: 9999px;
                background: var(--dot);
            }

            .content {
                position: relative;
                display: flex;
                flex: 1;
                gap: 48px;
            }

            .intro {
                display: flex;
                flex: 1;
                flex-direction: column;
                justify-content: center;
            }

            h1 {
                font-family: var(--font-heading);
                font-size: 62px;
                font-weight: 800;
                line-height: 1.06;
                letter-spacing: -0.03em;
            }

            .highlight {
                color: var(--primary);
            }

            .lead {
                margin-top: 24px;
                font-size: 26px;
                line-height: 1.4;
                color: var(--muted);
            }

            .lead strong {
                color: var(--ink);
                font-weight: 600;
            }

            .site {
                display: inline-flex;
                align-self: flex-start;
                align-items: center;
                gap: 10px;
                margin-top: 36px;
                padding: 12px 22px;
                border-radius: 12px;
                background: var(--pill);
                color: var(--on-pill);
                font-family: var(--font-heading);
                font-size: 24px;
                font-weight: 700;
            }

            .card-wrap {
                position: relative;
                flex-shrink: 0;
                align-self: center;
                width: 340px;
            }

            .card-glow {
                position: absolute;
                inset: -10px;
                border-radius: 28px;
                background: linear-gradient(to top right, rgb(37 86 207 / 0.08), rgb(247 211 37 / 0.22), transparent);
                filter: blur(16px);
            }

            .card {
                position: relative;
                overflow: hidden;
                border: 1px solid var(--hairline);
                border-radius: 20px;
                background: var(--surface-card);
                box-shadow:
                    0 20px 25px -5px rgb(11 28 48 / 0.1),
                    0 8px 10px -6px rgb(11 28 48 / 0.1);
            }

            .profile {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 14px;
                padding: 32px 24px 26px;
                text-align: center;
                background: var(--surface-low);
                border-bottom: 1px solid var(--hairline);
            }

            .profile img {
                width: 132px;
                height: 132px;
                object-fit: contain;
            }

            /* A typographic mark, for a site without a logo file */
            .mark {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                height: 132px;
                font-size: 44px;
                font-weight: 300;
                letter-spacing: -0.02em;
            }

            .profile img.wide {
                width: 280px;
                height: auto;
                margin: 12px 0 0;
            }

            .mark.suits {
                gap: 14px;
                font-size: 64px;
                color: var(--ink);
            }

            .name {
                font-family: var(--font-heading);
                font-size: 28px;
                font-weight: 700;
                letter-spacing: -0.01em;
            }

            .role {
                margin-top: -8px;
                font-size: 18px;
                color: var(--muted);
            }

            .stats {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                padding: 20px 8px;
                text-align: center;
            }

            .stats div {
                display: flex;
                flex-direction: column-reverse;
            }

            .stats div + div {
                border-left: 1px solid var(--hairline);
            }

            .stats dd {
                font-family: var(--font-heading);
                font-size: 30px;
                font-weight: 700;
                line-height: 1.2;
                white-space: nowrap;
                color: var(--primary);
            }

            .stats dd.neutral {
                color: var(--ink);
            }

            /* A word, not a figure: smaller, or it overflows its third of the card */
            .stats dd.word {
                font-size: 20px;
                line-height: 36px;
            }

            .stats dt {
                font-size: 12px;
                font-weight: 600;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: #8a8f98;
            }

            /* The touch icon has a white background: the panel takes it */
            .profile {
                background: #ffffff;
            }
        </style>
    </head>
    <body>
        <script>
            if (location.hash === '#github') {
                document.body.classList.add('github')
            }
        </script>
        <div class="blob blob-primary"></div>
        <div class="blob blob-accent"></div>

        <div class="badges">
            <span class="badge badge-status"><span class="dot"></span>SILARHI Labs</span>
            <span class="badge badge-topic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6" /><path d="m8 6-6 6 6 6" /></svg>Demo application</span>
        </div>
        <div class="content">
            <div class="intro">
                <h1>Symfony Docker <span class="highlight">CI</span> Demo</h1>
                <p class="lead">A <strong>Symfony 8</strong> app built in a multi-stage Docker image and deployed by <strong>CircleCI</strong>.</p>
                <span class="site"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" /><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" /></svg>labs.silarhi.fr</span>
            </div>

            <div class="card-wrap">
                <div class="card-glow"></div>
                <div class="card">
                    <div class="profile">
                        <img src="../public/apple-touch-icon.png" alt="" />
                        <p class="name">SILARHI Labs</p>
                        <p class="role">Demos by SILARHI</p>
                    </div>
                    <!-- Evergreen figures: a count would go stale -->
                    <dl class="stats">
                        <div><dt>PHP</dt><dd class="">8.4+</dd></div>
                        <div><dt>Symfony</dt><dd class="">8.1</dd></div>
                        <div><dt>Deploy</dt><dd class="neutral word">CircleCI</dd></div>
                    </dl>
                </div>
            </div>
        </div>
    </body>
</html>
