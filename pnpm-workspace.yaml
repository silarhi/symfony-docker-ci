# Dependencies allowed to run install scripts (pnpm blocks them by default)
allowBuilds:
    # Ships prebuilt binaries; its install script is only a build-from-source fallback
    '@parcel/watcher': false
# Released less than a day before it was added here, under the pnpm minimum release age
minimumReleaseAgeExclude:
    - '@silarhi/ux-icons-js@0.3.1'
